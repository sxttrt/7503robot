# 模拟场景，不连接真实硬件。延迟和超时的单位均为秒。
scenarios:
  normal: {}
  navigation_fail_once:
    failures: {NAV_RACK: 1}
  navigation_always_fails:
    failures: {NAV_RACK: 999}
  navigation_timeout:
    timeout_states: [NAV_RACK]
  wrong_rack_qr:
    qr_wrong_states: [WAIT_RACK_QR]
  qr_not_found:
    qr_empty_states: [WAIT_RACK_QR]
  stale_qr:
    qr_stale: true
  docking_failure:
    failures: {DOCK_ENTER: 1}
  lift_failure:
    failures: {LIFT_UP: 1}
  lift_timeout:
    timeout_states: [LIFT_UP]
  delivery_navigation_failure:
    failures: {NAV_END: 1}
  lowering_failure:
    failures: {LIFT_DOWN: 1}
  exit_failure:
    failures: {DOCK_EXIT: 1}
  delayed_cancel_result:
    timeout_states: [NAV_RACK]
    cancel_result_delay_sec: 1.0
  delayed_goal_accept:
    accept_delay_sec: 1.0
  health_dropout:
    # 在首个货架尚未完成时中断在线消息，验证断联后停止。
    health_dropout_after_sec: 0.8
  fault_during_delivery:
    fault_during_delivery: true
  stop_failure:
    failures: {NAV_RACK: 1}
    stop_failure: true
  stop_fail_once:
    failures: {NAV_RACK: 1}
    stop_failures: 1
  no_start:
    no_start: true
