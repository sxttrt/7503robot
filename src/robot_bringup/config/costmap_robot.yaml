# 实机专用、真实时钟。尺寸/足迹、scan 名称与 navigation_robot.yaml 同步测量修改。
# planner_server 仅托管雷达 costmap，robot_navigation 使用自己的四连通规划器。
planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      use_astar: true
      allow_unknown: true
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_link
      update_frequency: 5.0
      publish_frequency: 2.0
      # Fixed map covers the whole measured field; planner enforces exact
      # field_size. Nav2 width/height are integer metres (ceil of field size).
      rolling_window: false
      origin_x: 0.0
      origin_y: 0.0
      width: 4
      height: 2
      resolution: 0.025
      # Retain 255 to distinguish unseen from measured-free cells. Our
      # planner allows 255 only within navigation_robot.yaml field_size.
      track_unknown_space: true
      transform_tolerance: 0.3
      footprint: '[[0.12,0.08],[-0.12,0.08],[-0.12,-0.08],[0.12,-0.08]]'
      footprint_padding: 0.05
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          marking: true
          clearing: true
          raytrace_max_range: 7.0
          obstacle_max_range: 7.0
          expected_update_rate: 0.5
          max_obstacle_height: 2.0
        footprint_clearing_enabled: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.23
        cost_scaling_factor: 5.0
      always_send_full_costmap: true
