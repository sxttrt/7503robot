# Gazebo truth is private to actuation; /odom is radar-only.
- ros_topic_name: clock
  gz_topic_name: /clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: gz.msgs.Clock
  direction: GZ_TO_ROS
- ros_topic_name: simulation/robot_pose
  gz_topic_name: /model/robot/pose
  ros_type_name: geometry_msgs/msg/PoseArray
  gz_type_name: gz.msgs.Pose_V
  direction: GZ_TO_ROS
- ros_topic_name: joint_states
  gz_topic_name: /world/rack_world/model/robot/joint_state
  ros_type_name: sensor_msgs/msg/JointState
  gz_type_name: gz.msgs.Model
  direction: GZ_TO_ROS
- ros_topic_name: scan
  gz_topic_name: /scan
  ros_type_name: sensor_msgs/msg/LaserScan
  gz_type_name: gz.msgs.LaserScan
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA
  frame_id: laser
- ros_topic_name: rack/A/pose
  gz_topic_name: /model/rack_a/pose
  ros_type_name: geometry_msgs/msg/PoseArray
  gz_type_name: gz.msgs.Pose_V
  direction: GZ_TO_ROS
- ros_topic_name: rack/B/pose
  gz_topic_name: /model/rack_b/pose
  ros_type_name: geometry_msgs/msg/PoseArray
  gz_type_name: gz.msgs.Pose_V
  direction: GZ_TO_ROS
- ros_topic_name: rack/C/pose
  gz_topic_name: /model/rack_c/pose
  ros_type_name: geometry_msgs/msg/PoseArray
  gz_type_name: gz.msgs.Pose_V
  direction: GZ_TO_ROS
- ros_topic_name: rack/D/pose
  gz_topic_name: /model/rack_d/pose
  ros_type_name: geometry_msgs/msg/PoseArray
  gz_type_name: gz.msgs.Pose_V
  direction: GZ_TO_ROS
- ros_topic_name: camera/camera_info
  gz_topic_name: /camera_info
  ros_type_name: sensor_msgs/msg/CameraInfo
  gz_type_name: gz.msgs.CameraInfo
  direction: GZ_TO_ROS
- ros_topic_name: camera/image_raw
  gz_topic_name: /camera
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS
- ros_topic_name: lift_cmd
  gz_topic_name: /simulation/lift_cmd
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: gz.msgs.Double
  direction: ROS_TO_GZ
# Gazebo-only actuator channels; /cmd_vel remains the framework/hardware contract.
- ros_topic_name: simulation/chassis_cmd
  gz_topic_name: /simulation/chassis_cmd
  ros_type_name: geometry_msgs/msg/Twist
  gz_type_name: gz.msgs.Twist
  direction: ROS_TO_GZ
- ros_topic_name: payload_name
  gz_topic_name: /simulation/payload_name
  ros_type_name: std_msgs/msg/String
  gz_type_name: gz.msgs.StringMsg
  direction: ROS_TO_GZ
- ros_topic_name: simulation/actuator/status
  gz_topic_name: /simulation/actuator/status
  ros_type_name: std_msgs/msg/String
  gz_type_name: gz.msgs.StringMsg
  direction: GZ_TO_ROS
